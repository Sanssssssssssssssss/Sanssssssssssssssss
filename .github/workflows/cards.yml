name: Refresh profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate activity card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=issues&line_height=24&custom_title=Workshop%20log&bg_color=141B2D&title_color=F4CA8A&text_color=C9D4E8&icon_color=8BC5DA&border_color=34435B&border_radius=8&disable_animations=true&card_width=420
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&custom_title=Languages&bg_color=141B2D&title_color=F4CA8A&text_color=C9D4E8&border_color=34435B&border_radius=8&disable_animations=true&card_width=420
          path: assets/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Commit refreshed cards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/languages.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh profile cards'
          git push
